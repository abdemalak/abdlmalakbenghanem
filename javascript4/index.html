function factorial(n) {
let result = 1;
for (let i = 1; i <= n; i++) {
    result *= i;
}
return result;
}

function isprime(n) {
if (n <= 1) return false;
for (let i = 2; i < n; i++) {
    if (n % i === 0) return false;
}
return true;
}

function fibonacci(n) {
let seq = [0, 1];
for (let i = 2; i < n; i++) {
    seq.push(seq[i - 1] + seq[i - 2]);
}
return seq;
}
